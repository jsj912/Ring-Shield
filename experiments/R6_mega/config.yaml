  w_ce2: 6.275014431494497
  norm_method: z_normalize
  dropout: 0.00983468338330501
  final_dropout: 0.10527690625126304
flags:
  model: gin
  task: edge_class
  emlps: true
  reverse_mp: true
  ego: true
  flatten_edges: true
  edge_agg_type: gin
  node_agg_type: sum
  ports: false
  ports_batch: false
  tds: false
  reverse_mp_lp: false
  adamm_hetero: false
seeds:
- 1
- 2
- 3
- 4
- 5
epochs: 80
patience: 20
batch_size: 8192
num_neighbors:
- 100
- 100
causal_sampling: true
loader_route: ours_fallback
loader_window_s: 1800
deviations_from_upstream:
- early stopping on val minority-F1 (patience 20, R1's rule) inside their published
  80-epoch budget, instead of a fixed 80
- our causal loader (models/causal_loader.py) in place of their LinkNeighborLoader
  call -- same loader class, temporal guarantee added
- simp_edge_batch recomputed per batch after the causal filter (equivalent grouping)
- seeds 1-5 from configs/seeds.yaml instead of their single seed
data:
  source: data/raw/formatted_transactions.csv (the file our own detector reads)
  split: their get_data, asserted identical to amlworld_{train,val,test}.parquet
  label_informed_preprocessing: false
calibration: models/calibrate.py --scores-dir <out-dir> (isotonic, fit on val only)
