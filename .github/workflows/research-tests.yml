name: Research tests

on:
  push:
  pull_request:

# Unit tests only: the AMLworld data is not in the repository, so tests that need data/processed/
# skip (docs/PITFALLS.md section 8b). Each part runs in its own pinned environment, as locally
# (scripts/bootstrap.ps1).
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The lock is the CUDA 12.1 build; the runner has no GPU, so torch and the PyG extensions
      # (torch_scatter, torch_sparse) are swapped for the CPU builds of the same versions.
      - name: Install the research lock (CPU torch and PyG wheels; pywinpty is Windows-only)
        run: |
          grep -v -i '^pywinpty==' requirements-lock.txt \
            | sed -e 's#data.pyg.org/whl/torch-2.5.1+cu121.html#data.pyg.org/whl/torch-2.5.1+cpu.html#' \
                  -e 's#download.pytorch.org/whl/cu121#download.pytorch.org/whl/cpu#' \
                  -e 's/+pt25cu121/+pt25cpu/' \
                  -e 's/^torch==2.5.1+cu121$/torch==2.5.1/' \
            > /tmp/requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-ci.txt
      - name: tests, contract/tests, preprocessing/tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests contract/tests preprocessing/tests -q

  explainability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: explainability/requirements-test.txt
      - run: python -m pip install -r explainability/requirements-test.txt
      # The other explainability test files read L4's outputs (results/xai/*.parquet, contract/out rings),
      # which are not in git; run them locally after an L4 run (docs/REPRODUCE.md section 13).
      - name: explainability/tests that need no L4 outputs
        env:
          PYTHONIOENCODING: utf-8
        run: >-
          python -m pytest -q
          explainability/tests/test_account_weights.py explainability/tests/test_edge_weights.py
          explainability/tests/test_match.py explainability/tests/test_narrative.py
          explainability/tests/test_stats.py explainability/tests/test_tenant_visible_cache.py
