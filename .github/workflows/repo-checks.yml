name: Repository checks

on:
  pull_request:

jobs:
  file-sizes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No file over 5 MB added or grown
        run: python scripts/check_file_sizes.py "origin/${{ github.base_ref }}"
